name: Enhance chatbot accessibility controls

on:
  push:
    branches:
      - agent/multilingual-accessible-chatbot

permissions:
  contents: write

jobs:
  enhance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multilingual-accessible-chatbot

      - name: Add Pause Resume Stop and speed controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('chatbot.js')
          text = p.read_text(encoding='utf-8')
          marker = 'id="vod-chat-audio-controls"'
          if marker in text:
              raise SystemExit(0)

          text = text.replace(
              '''      <p class="vod-chat__note" id="vod-chat-language-help">Choose a South African language, or let the chatbot detect it.</p>\n    </div>''',
              '''      <p class="vod-chat__note" id="vod-chat-language-help">Choose a South African language, or let the chatbot detect it.</p>\n      <div id="vod-chat-audio-controls" class="vod-chat__actions" hidden aria-label="Read-aloud controls">\n        <button id="vod-chat-pause" type="button" class="vod-chat__speak">Pause</button>\n        <button id="vod-chat-resume" type="button" class="vod-chat__speak">Resume</button>\n        <button id="vod-chat-audio-stop" type="button" class="vod-chat__stop">Stop</button>\n        <label for="vod-chat-speed" style="display:inline-flex;align-items:center;gap:6px;margin:0">Speed\n          <select id="vod-chat-speed" aria-label="Read-aloud speed" style="width:auto;min-height:44px">\n            <option value="0.75">0.75×</option>\n            <option value="1" selected>1×</option>\n            <option value="1.25">1.25×</option>\n            <option value="1.5">1.5×</option>\n          </select>\n        </label>\n      </div>\n    </div>'''
          )

          text = text.replace(
              '''  const stopBtn = panel.querySelector('.vod-chat__stop');\n  let lastFocus = null;''',
              '''  const stopBtn = panel.querySelector('.vod-chat__stop');\n  const audioControls = panel.querySelector('#vod-chat-audio-controls');\n  const pauseAudioBtn = panel.querySelector('#vod-chat-pause');\n  const resumeAudioBtn = panel.querySelector('#vod-chat-resume');\n  const stopAudioBtn = panel.querySelector('#vod-chat-audio-stop');\n  const audioSpeed = panel.querySelector('#vod-chat-speed');\n  let lastFocus = null;'''
          )

          text = text.replace(
              '''    utterance.rate = 0.95;\n    utterance.onstart = () => setStatus('Reading the response aloud.');\n    utterance.onend = () => setStatus('Finished reading the response.');''',
              '''    utterance.rate = Number(audioSpeed?.value || 1);\n    utterance.onstart = () => {\n      if (audioControls) audioControls.hidden = false;\n      setStatus('Reading the response aloud. Use Pause, Resume, Stop or the speed control at any time.');\n    };\n    utterance.onend = () => {\n      if (audioControls) audioControls.hidden = true;\n      setStatus('Finished reading the response.');\n    };'''
          )

          text = text.replace(
              '''    utterance.onerror = () => setStatus('Audio could not be played. The full response is still available as text.');\n    window.speechSynthesis.speak(utterance);\n  }''',
              '''    utterance.onerror = () => {\n      if (audioControls) audioControls.hidden = true;\n      setStatus('Audio could not be played. The full response is still available as text.');\n    };\n    window.speechSynthesis.speak(utterance);\n  }\n\n  pauseAudioBtn?.addEventListener('click', () => {\n    if (window.speechSynthesis?.speaking && !window.speechSynthesis.paused) {\n      window.speechSynthesis.pause();\n      setStatus('Reading paused.');\n    }\n  });\n  resumeAudioBtn?.addEventListener('click', () => {\n    if (window.speechSynthesis?.paused) {\n      window.speechSynthesis.resume();\n      setStatus('Reading resumed.');\n    }\n  });\n  stopAudioBtn?.addEventListener('click', () => {\n    if ('speechSynthesis' in window) window.speechSynthesis.cancel();\n    if (audioControls) audioControls.hidden = true;\n    setStatus('Reading stopped.');\n  });'''
          )

          text = text.replace(
              '''      <p class="vod-chat__note">Voice is optional. Spoken input is placed in the text box first so you can review, edit, send, try again or cancel.</p>''',
              '''      <p class="vod-chat__note">Voice is optional. If your browser supports speech recognition, it may use your browser or device speech service. Your spoken words appear here as an editable transcript and are not sent to the chatbot until you press Send. You can always type instead.</p>'''
          )

          text = text.replace(
              '''    if ('speechSynthesis' in window) window.speechSynthesis.cancel();\n    (lastFocus || launcher).focus();''',
              '''    if ('speechSynthesis' in window) window.speechSynthesis.cancel();\n    if (audioControls) audioControls.hidden = true;\n    (lastFocus || launcher).focus();'''
          )

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit accessibility enhancement
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No accessibility enhancement needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatbot.js
          git commit -m "Add full accessible read-aloud controls"
          git push origin HEAD:agent/multilingual-accessible-chatbot

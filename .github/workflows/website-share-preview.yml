name: Website share preview

on:
  pull_request:
    paths:
      - 'app/layout.tsx'
      - 'app/opengraph-image.tsx'
      - 'tests/website-share-preview.test.mjs'
      - '.github/workflows/website-share-preview.yml'

jobs:
  website-share-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/website-share-preview.test.mjs

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Voice of Disability logo mark: a speech bubble containing a voice waveform">
  <title>Voice of Disability logo mark</title>
  <defs>
    <linearGradient id="vodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B2A86"/>
      <stop offset="0.55" stop-color="#B0227A"/>
      <stop offset="1" stop-color="#D6246E"/>
    </linearGradient>
  </defs>
  <!-- Speech bubble = giving voice a shape -->
  <path fill="url(#vodGrad)" d="M28 12h64a20 20 0 0 1 20 20v40a20 20 0 0 1-20 20H52l-20 18a3 3 0 0 1-5-2.4V92a20 20 0 0 1-20-20V32A20 20 0 0 1 28 12Z"/>
  <!-- Voice waveform: five ascending/descending rounded bars -->
  <g fill="#FFFFFF">
    <rect x="34" y="52" width="8" height="16" rx="4"/>
    <rect x="49" y="42" width="8" height="36" rx="4"/>
    <rect x="64" y="30" width="8" height="60" rx="4" fill="#FFC24B"/>
    <rect x="79" y="42" width="8" height="36" rx="4"/>
    <rect x="94" y="52" width="8" height="16" rx="4"/>
  </g>
</svg>
